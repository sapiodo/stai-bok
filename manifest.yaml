bok:
  id: stai-bok
  title: Systems Thinking with AI — Body of Knowledge
  description: |
    Public CC BY-NC-SA subset методологии 12-CM-STAI / 514-CM-MIPT.
    16 концепт-карточек по 5-слойной Learning Object структуре +
    2 native Claude Code skills (/solve-problem orchestration +
    /study-concept LO traversal) + lessons L1-L7 + self-tests Q2-Q7.
  type: system
  author: Дмитрий Безуглый
  language: ru
  version: '1.1'
  license: CC-BY-NC-SA-4.0
  source_repo: https://github.com/sapiodo/stai-bok
  source_course: 514-CM-MIPT (Системное и стратегическое мышление, МФТИ)


# DPS levels (simplified vs ST_BoK — stai-bok skills monolithic, Level 2
# decomposition в backlog).
dps_levels:
  L0:
    name: Retrieval
    description: Прямой ответ из концепт-карточки
    skills: []
  L2:
    name: Concept Study
    description: 5-слойное прохождение одной концепции
    skills:
    - STAI-S-Study-Concept
  L3:
    name: Deep System
    description: Полный 4-фазный pipeline решения проблемы
    skills:
    - STAI-S-Solve-Problem


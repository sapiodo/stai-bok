<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, 'SF Pro Display', -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1200" height="700" fill="#F8FFF2" rx="12"/>

  <!-- Header -->
  <rect width="1200" height="65" fill="#0C2340" rx="12"/>
  <rect y="55" width="1200" height="12" fill="#0C2340"/>
  <text x="600" y="32" text-anchor="middle" fill="#F8FFF2" font-size="24" font-weight="700">STOCKS vs FLOWS — ИНЕРЦИЯ СИСТЕМЫ</text>
  <text x="600" y="52" text-anchor="middle" fill="#99ADCF" font-size="13">Почему систему нельзя изменить мгновенно | Донелла Медоуз</text>

  <!-- LEFT SIDE: Bathtub Metaphor -->

  <!-- Faucet / Inflow -->
  <rect x="270" y="110" width="40" height="50" fill="#99ADCF" rx="3"/>
  <rect x="250" y="100" width="80" height="15" fill="#99ADCF" rx="4"/>
  <text x="290" y="90" text-anchor="middle" fill="#0C2340" font-size="16" font-weight="700">INFLOW</text>
  <text x="290" y="180" text-anchor="middle" fill="#3DCBC0" font-size="12">(кран)</text>

  <!-- Water stream -->
  <rect x="283" y="160" width="14" height="60" fill="#3DCBC0" rx="7" opacity="0.6"/>

  <!-- Bathtub -->
  <rect x="100" y="220" width="400" height="200" fill="#fff" stroke="#0C2340" stroke-width="3" rx="20"/>

  <!-- Water in tub -->
  <rect x="103" y="300" width="394" height="117" fill="#3DCBC0" rx="0 0 18 18" opacity="0.3"/>
  <rect x="103" y="300" width="394" height="117" fill="none" stroke="#3DCBC0" stroke-width="1.5" stroke-dasharray="none"/>

  <!-- Water level line -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#3DCBC0" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="510" y="295" fill="#3DCBC0" font-size="13" font-weight="600">← Уровень воды</text>

  <!-- STOCK label in center of tub -->
  <text x="300" y="365" text-anchor="middle" fill="#0C2340" font-size="28" font-weight="700" opacity="0.3">STOCK</text>
  <text x="300" y="390" text-anchor="middle" fill="#0C2340" font-size="13" opacity="0.5">накопление</text>

  <!-- Drain / Outflow -->
  <rect x="283" y="420" width="14" height="40" fill="#F7AF22" rx="7" opacity="0.6"/>
  <rect x="270" y="460" width="40" height="15" fill="#99ADCF" rx="4"/>
  <text x="290" y="495" text-anchor="middle" fill="#0C2340" font-size="16" font-weight="700">OUTFLOW</text>
  <text x="290" y="512" text-anchor="middle" fill="#F7AF22" font-size="12">(слив)</text>

  <!-- Inflow arrow -->
  <polygon points="283,195 297,195 290,210" fill="#3DCBC0"/>

  <!-- Outflow arrow -->
  <polygon points="283,445 297,445 290,460" fill="#F7AF22"/>

  <!-- Key insight box -->
  <rect x="60" y="535" width="480" height="50" fill="#F7AF22" rx="8" opacity="0.12"/>
  <text x="300" y="557" text-anchor="middle" fill="#0C2340" font-size="14" font-weight="700">Нельзя мгновенно изменить уровень воды —</text>
  <text x="300" y="575" text-anchor="middle" fill="#0C2340" font-size="14">можно только управлять краном и сливом</text>

  <!-- RIGHT SIDE: Examples Table -->
  <rect x="600" y="100" width="570" height="35" fill="#0C2340" rx="6"/>
  <text x="640" y="123" fill="#F8FFF2" font-size="13" font-weight="700">STOCK</text>
  <text x="790" y="123" fill="#F8FFF2" font-size="13" font-weight="700">INFLOW (↑)</text>
  <text x="940" y="123" fill="#F8FFF2" font-size="13" font-weight="700">OUTFLOW (↓)</text>
  <text x="1090" y="123" fill="#F8FFF2" font-size="13" font-weight="700">DELAY</text>

  <!-- Row 1: Users -->
  <rect x="600" y="140" width="570" height="50" fill="#fff" rx="0" stroke="#eee" stroke-width="1"/>
  <text x="640" y="165" fill="#0C2340" font-size="14" font-weight="600">Пользователи</text>
  <text x="790" y="165" fill="#3DCBC0" font-size="13">Регистрации</text>
  <text x="940" y="165" fill="#F7AF22" font-size="13">Churn</text>
  <text x="1090" y="165" fill="#666" font-size="12">Месяцы</text>

  <!-- Row 2: Tech debt -->
  <rect x="600" y="190" width="570" height="50" fill="#f9f9f9" rx="0" stroke="#eee" stroke-width="1"/>
  <text x="640" y="215" fill="#0C2340" font-size="14" font-weight="600">Техдолг</text>
  <text x="790" y="215" fill="#3DCBC0" font-size="13">Хаки, фиксы</text>
  <text x="940" y="215" fill="#F7AF22" font-size="13">Рефакторинг</text>
  <text x="1090" y="215" fill="#666" font-size="12">Незаметно</text>

  <!-- Row 3: Trust (highlighted) -->
  <rect x="600" y="240" width="570" height="65" fill="#e94560" rx="0" opacity="0.06" stroke="#e94560" stroke-width="1"/>
  <text x="640" y="267" fill="#0C2340" font-size="14" font-weight="600">Доверие</text>
  <text x="640" y="285" fill="#e94560" font-size="11" font-weight="600">⚠ АСИММЕТРИЯ</text>
  <text x="790" y="267" fill="#3DCBC0" font-size="13">Хороший опыт</text>
  <text x="790" y="285" fill="#3DCBC0" font-size="11">↑ годы</text>
  <text x="940" y="267" fill="#F7AF22" font-size="13">Инциденты</text>
  <text x="940" y="285" fill="#e94560" font-size="11" font-weight="600">↓ минуты!</text>
  <text x="1090" y="275" fill="#e94560" font-size="12" font-weight="600">Асимметричный</text>

  <!-- Row 4: Knowledge -->
  <rect x="600" y="305" width="570" height="50" fill="#fff" rx="0" stroke="#eee" stroke-width="1"/>
  <text x="640" y="330" fill="#0C2340" font-size="14" font-weight="600">Знания команды</text>
  <text x="790" y="330" fill="#3DCBC0" font-size="13">Обучение, наём</text>
  <text x="940" y="330" fill="#F7AF22" font-size="13">Увольнения</text>
  <text x="1090" y="330" fill="#666" font-size="12">Недели</text>

  <!-- Row 5: Brand -->
  <rect x="600" y="355" width="570" height="50" fill="#f9f9f9" rx="0" stroke="#eee" stroke-width="1"/>
  <text x="640" y="380" fill="#0C2340" font-size="14" font-weight="600">Бренд</text>
  <text x="790" y="380" fill="#3DCBC0" font-size="13">Маркетинг, сарафан</text>
  <text x="940" y="380" fill="#F7AF22" font-size="13">Негативный опыт</text>
  <text x="1090" y="380" fill="#666" font-size="12">Годы</text>

  <!-- Asymmetry insight -->
  <rect x="600" y="425" width="570" height="75" fill="#0C2340" rx="8" opacity="0.06"/>
  <text x="620" y="450" fill="#0C2340" font-size="14" font-weight="700">АСИММЕТРИЯ STOCKS</text>
  <text x="620" y="472" fill="#555" font-size="13">Некоторые stocks строятся медленно, а разрушаются мгновенно.</text>
  <text x="620" y="492" fill="#555" font-size="13">Доверие: годы → 1 инцидент. Техдолг: быстро ↑, медленно ↓.</text>

  <!-- Practical takeaway -->
  <rect x="600" y="520" width="570" height="65" fill="#3DCBC0" rx="8" opacity="0.12"/>
  <text x="620" y="545" fill="#0C2340" font-size="14" font-weight="700">ПРАКТИЧЕСКИЙ ВЫВОД</text>
  <text x="620" y="565" fill="#0C2340" font-size="13">При оценке решения спрашивайте:</text>
  <text x="620" y="580" fill="#0C2340" font-size="14" font-weight="600" font-style="italic">«Сколько времени нужно, чтобы stock изменился?»</text>

  <!-- Connection box at bottom -->
  <rect x="60" y="610" width="1080" height="70" fill="#fff" rx="8" stroke="#0C2340" stroke-width="1" opacity="0.8"/>
  <text x="600" y="635" text-anchor="middle" fill="#0C2340" font-size="14" font-weight="700">СВЯЗЬ С РЫЧАГАМИ</text>
  <text x="600" y="658" text-anchor="middle" fill="#555" font-size="13">Любое вмешательство (рычаг) должно учитывать инерцию stocks.</text>
  <text x="600" y="675" text-anchor="middle" fill="#555" font-size="13">Изменили правила (ур. 3) → stock привычек не исчезнет мгновенно. Изменили цели (ур. 4) → stock культуры остаётся.</text>

  <!-- Footer -->
  <text x="600" y="698" text-anchor="middle" fill="#99ADCF" font-size="10">514-CM-MIPT | Занятие 5 | Источник: Meadows «Thinking in Systems» (2008)</text>
</svg>
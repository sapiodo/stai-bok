<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Inter, 'SF Pro Display', -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1000" height="700" fill="#F8FFF2" rx="12"/>

  <!-- Header -->
  <rect width="1000" height="60" fill="#0C2340" rx="12"/>
  <rect y="50" width="1000" height="12" fill="#0C2340"/>
  <text x="500" y="32" text-anchor="middle" fill="#F8FFF2" font-size="22" font-weight="700">ICEBERG × LEVERAGE POINTS</text>
  <text x="500" y="52" text-anchor="middle" fill="#99ADCF" font-size="12">Чем глубже в Iceberg — тем сильнее рычаг</text>

  <!-- Water line -->
  <line x1="0" y1="170" x2="1000" y2="170" stroke="#3DCBC0" stroke-width="2" stroke-dasharray="12,6"/>
  <text x="35" y="163" fill="#3DCBC0" font-size="11" font-weight="600">~ поверхность ~</text>

  <!-- LEFT: Iceberg -->
  <text x="200" y="95" text-anchor="middle" fill="#0C2340" font-size="16" font-weight="700">ICEBERG MODEL</text>

  <!-- Level 1: Events (above waterline) -->
  <rect x="80" y="110" width="240" height="50" fill="#D4D8DD" rx="8" opacity="0.3"/>
  <rect x="80" y="110" width="240" height="50" fill="none" stroke="#999" stroke-width="1.5" rx="8"/>
  <text x="200" y="132" text-anchor="middle" fill="#0C2340" font-size="14" font-weight="700">СОБЫТИЯ</text>
  <text x="200" y="150" text-anchor="middle" fill="#666" font-size="11">Что видно, факты, данные</text>

  <!-- Level 2: Patterns -->
  <rect x="60" y="185" width="280" height="65" fill="#99ADCF" rx="8" opacity="0.15"/>
  <rect x="60" y="185" width="280" height="65" fill="none" stroke="#99ADCF" stroke-width="1.5" rx="8"/>
  <text x="200" y="212" text-anchor="middle" fill="#0C2340" font-size="14" font-weight="700">ПАТТЕРНЫ</text>
  <text x="200" y="232" text-anchor="middle" fill="#666" font-size="11">Что повторяется, тренды</text>

  <!-- Level 3: Structures -->
  <rect x="40" y="265" width="320" height="75" fill="#0C2340" rx="8" opacity="0.08"/>
  <rect x="40" y="265" width="320" height="75" fill="none" stroke="#0C2340" stroke-width="1.5" rx="8"/>
  <text x="200" y="295" text-anchor="middle" fill="#0C2340" font-size="14" font-weight="700">СТРУКТУРЫ</text>
  <text x="200" y="315" text-anchor="middle" fill="#666" font-size="11">Процессы, технологии, правила</text>
  <text x="200" y="330" text-anchor="middle" fill="#666" font-size="11">Что порождает паттерны</text>

  <!-- Level 4: Mental Models -->
  <rect x="20" y="355" width="360" height="85" fill="#e94560" rx="8" opacity="0.08"/>
  <rect x="20" y="355" width="360" height="85" fill="none" stroke="#e94560" stroke-width="2" rx="8"/>
  <text x="200" y="385" text-anchor="middle" fill="#e94560" font-size="14" font-weight="700">МЕНТАЛЬНЫЕ МОДЕЛИ</text>
  <text x="200" y="405" text-anchor="middle" fill="#666" font-size="11">Убеждения, допущения, ценности</text>
  <text x="200" y="422" text-anchor="middle" fill="#666" font-size="11">Что определяет всё остальное</text>

  <!-- Depth arrow (left side) -->
  <line x1="15" y1="120" x2="15" y2="430" stroke="#0C2340" stroke-width="2"/>
  <polygon points="15,430 10,420 20,420" fill="#0C2340"/>
  <text x="10" y="275" fill="#0C2340" font-size="10" font-weight="600" transform="rotate(-90, 10, 275)">ГЛУБИНА</text>

  <!-- RIGHT: Leverage Points -->
  <text x="770" y="95" text-anchor="middle" fill="#0C2340" font-size="16" font-weight="700">LEVERAGE POINTS</text>

  <!-- Level 1: Parameters -->
  <rect x="640" y="110" width="260" height="50" fill="#D4D8DD" rx="8" opacity="0.3"/>
  <rect x="640" y="110" width="260" height="50" fill="none" stroke="#999" stroke-width="1.5" rx="8"/>
  <circle cx="665" cy="135" r="12" fill="#999"/>
  <text x="665" y="140" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1</text>
  <text x="690" y="132" fill="#0C2340" font-size="13" font-weight="700">Параметры</text>
  <text x="690" y="150" fill="#666" font-size="11">Числа, бюджеты ⚪</text>

  <!-- Level 2: Buffers + Structure (info) -->
  <rect x="620" y="185" width="300" height="65" fill="#99ADCF" rx="8" opacity="0.15"/>
  <rect x="620" y="185" width="300" height="65" fill="none" stroke="#99ADCF" stroke-width="1.5" rx="8"/>
  <circle cx="645" cy="210" r="12" fill="#99ADCF"/>
  <text x="645" y="215" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2</text>
  <text x="670" y="210" fill="#0C2340" font-size="13" font-weight="700">Буферы (Stocks)</text>
  <text x="670" y="228" fill="#666" font-size="11">Накопления, запасы ⚪</text>
  <text x="670" y="243" fill="#99ADCF" font-size="10">+ Информационные потоки</text>

  <!-- Level 3: Structure (rules, self-org) -->
  <rect x="600" y="265" width="340" height="75" fill="#0C2340" rx="8" opacity="0.08"/>
  <rect x="600" y="265" width="340" height="75" fill="none" stroke="#0C2340" stroke-width="1.5" rx="8"/>
  <circle cx="625" cy="295" r="12" fill="#0C2340"/>
  <text x="625" y="300" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">3</text>
  <text x="650" y="295" fill="#0C2340" font-size="13" font-weight="700">Структура</text>
  <text x="650" y="313" fill="#666" font-size="11">Правила, самоорганизация 🔵</text>
  <text x="650" y="331" fill="#0C2340" font-size="10">Средний рычаг</text>

  <!-- Level 4-5: Goals + Paradigms -->
  <rect x="580" y="355" width="380" height="85" fill="#e94560" rx="8" opacity="0.08"/>
  <rect x="580" y="355" width="380" height="85" fill="none" stroke="#e94560" stroke-width="2" rx="8"/>
  <circle cx="605" cy="380" r="12" fill="#F7AF22"/>
  <text x="605" y="385" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">4</text>
  <text x="630" y="385" fill="#0C2340" font-size="13" font-weight="700">Цели системы</text>
  <text x="630" y="403" fill="#666" font-size="11">KPI, миссия 🟠</text>
  <circle cx="605" cy="420" r="12" fill="#e94560"/>
  <text x="605" y="425" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">5</text>
  <text x="630" y="425" fill="#e94560" font-size="13" font-weight="700">Парадигмы</text>
  <text x="730" y="425" fill="#666" font-size="11">Убеждения 🔴</text>

  <!-- Strength arrow (right side) -->
  <line x1="975" y1="120" x2="975" y2="430" stroke="#e94560" stroke-width="2"/>
  <polygon points="975,430 970,420 980,420" fill="#e94560"/>
  <text x="985" y="200" fill="#999" font-size="10" font-weight="600">СЛАБЫЙ</text>
  <text x="985" y="420" fill="#e94560" font-size="10" font-weight="700">СИЛЬНЫЙ</text>

  <!-- CONNECTION ARROWS (Iceberg → Leverage) -->
  <!-- Events → Parameters -->
  <line x1="320" y1="135" x2="635" y2="135" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="478" y="130" text-anchor="middle" fill="#999" font-size="18">→</text>

  <!-- Patterns → Buffers -->
  <line x1="340" y1="217" x2="615" y2="217" stroke="#99ADCF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="478" y="212" text-anchor="middle" fill="#99ADCF" font-size="18">→</text>

  <!-- Structures → Rules -->
  <line x1="360" y1="302" x2="595" y2="302" stroke="#0C2340" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="478" y="297" text-anchor="middle" fill="#0C2340" font-size="18">→</text>

  <!-- Mental Models → Goals/Paradigms -->
  <line x1="380" y1="397" x2="575" y2="397" stroke="#e94560" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="478" y="392" text-anchor="middle" fill="#e94560" font-size="18" font-weight="700">→</text>

  <!-- Center insight -->
  <rect x="430" y="455" width="140" height="30" fill="#3DCBC0" rx="15"/>
  <text x="500" y="475" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">ГЛУБЖЕ = СИЛЬНЕЕ</text>

  <!-- Bottom: Practical implications -->
  <rect x="30" y="510" width="940" height="160" fill="#fff" rx="10" stroke="#0C2340" stroke-width="1"/>

  <text x="500" y="540" text-anchor="middle" fill="#0C2340" font-size="15" font-weight="700">ПРАКТИЧЕСКИЕ СЛЕДСТВИЯ</text>

  <!-- 3 columns -->
  <!-- Col 1 -->
  <rect x="50" y="560" width="280" height="90" fill="#D4D8DD" rx="8" opacity="0.1"/>
  <text x="190" y="582" text-anchor="middle" fill="#0C2340" font-size="12" font-weight="700">ЕСЛИ РАБОТАЕТЕ С СОБЫТИЯМИ</text>
  <text x="190" y="602" text-anchor="middle" fill="#555" font-size="11">→ Уровень параметров</text>
  <text x="190" y="620" text-anchor="middle" fill="#555" font-size="11">→ Слабый рычаг</text>
  <text x="190" y="640" text-anchor="middle" fill="#999" font-size="11" font-style="italic">«Подкрутить числа»</text>

  <!-- Col 2 -->
  <rect x="360" y="560" width="280" height="90" fill="#0C2340" rx="8" opacity="0.05"/>
  <text x="500" y="582" text-anchor="middle" fill="#0C2340" font-size="12" font-weight="700">ЕСЛИ РАБОТАЕТЕ СО СТРУКТУРАМИ</text>
  <text x="500" y="602" text-anchor="middle" fill="#555" font-size="11">→ Уровень правил</text>
  <text x="500" y="620" text-anchor="middle" fill="#555" font-size="11">→ Средний-сильный рычаг</text>
  <text x="500" y="640" text-anchor="middle" fill="#0C2340" font-size="11" font-style="italic">«Изменить правила игры»</text>

  <!-- Col 3 -->
  <rect x="670" y="560" width="280" height="90" fill="#e94560" rx="8" opacity="0.06"/>
  <text x="810" y="582" text-anchor="middle" fill="#e94560" font-size="12" font-weight="700">ЕСЛИ РАБОТАЕТЕ С УБЕЖДЕНИЯМИ</text>
  <text x="810" y="602" text-anchor="middle" fill="#555" font-size="11">→ Уровень парадигм</text>
  <text x="810" y="620" text-anchor="middle" fill="#555" font-size="11">→ Очень сильный рычаг</text>
  <text x="810" y="640" text-anchor="middle" fill="#e94560" font-size="11" font-style="italic" font-weight="600">«Изменить мировоззрение»</text>

  <!-- Footer -->
  <text x="500" y="690" text-anchor="middle" fill="#99ADCF" font-size="10">514-CM-MIPT | Занятие 5 | Интеграция Iceberg Model и Leverage Points</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, 'SF Pro Display', -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1200" height="700" fill="#F8FFF2" rx="12"/>

  <!-- Header -->
  <rect width="1200" height="60" fill="#0C2340" rx="12"/>
  <rect y="50" width="1200" height="12" fill="#0C2340"/>
  <text x="600" y="32" text-anchor="middle" fill="#F8FFF2" font-size="22" font-weight="700">АРСЕНАЛ АНАЛИТИКА — ПОЛНЫЙ ЦИКЛ</text>
  <text x="600" y="52" text-anchor="middle" fill="#99ADCF" font-size="12">От обнаружения проблемы до приоритизированного решения</text>

  <!-- Main flow: 7 steps in a horizontal chain -->
  <!-- Step connectors (arrows) -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#99ADCF"/>
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0C2340"/>
    </marker>
  </defs>

  <!-- Phase label: ДИАГНОСТИКА -->
  <rect x="50" y="80" width="680" height="30" fill="#0C2340" rx="4" opacity="0.06"/>
  <text x="390" y="100" text-anchor="middle" fill="#0C2340" font-size="13" font-weight="700">ДИАГНОСТИКА</text>

  <!-- Phase label: ДЕЙСТВИЕ -->
  <rect x="750" y="80" width="400" height="30" fill="#3DCBC0" rx="4" opacity="0.12"/>
  <text x="950" y="100" text-anchor="middle" fill="#0C2340" font-size="13" font-weight="700">→ ДЕЙСТВИЕ</text>

  <!-- Step 1: 5 Why -->
  <rect x="60" y="130" width="140" height="160" fill="#fff" rx="10" stroke="#99ADCF" stroke-width="2"/>
  <rect x="60" y="130" width="140" height="35" fill="#99ADCF" rx="10"/>
  <rect x="60" y="155" width="140" height="10" fill="#99ADCF"/>
  <text x="130" y="153" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">5 WHY</text>
  <text x="80" y="188" fill="#0C2340" font-size="12" font-weight="600">Занятие 2</text>
  <text x="80" y="210" fill="#555" font-size="11">Где корень</text>
  <text x="80" y="226" fill="#555" font-size="11">проблемы?</text>
  <text x="80" y="255" fill="#3DCBC0" font-size="11" font-weight="600">→ Корневая</text>
  <text x="80" y="271" fill="#3DCBC0" font-size="11" font-weight="600">причина</text>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="210" x2="220" y2="210" stroke="#99ADCF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Iceberg -->
  <rect x="230" y="130" width="140" height="160" fill="#fff" rx="10" stroke="#99ADCF" stroke-width="2"/>
  <rect x="230" y="130" width="140" height="35" fill="#99ADCF" rx="10"/>
  <rect x="230" y="155" width="140" height="10" fill="#99ADCF"/>
  <text x="300" y="153" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">ICEBERG</text>
  <text x="250" y="188" fill="#0C2340" font-size="12" font-weight="600">Занятие 3</text>
  <text x="250" y="210" fill="#555" font-size="11">Что скрыто</text>
  <text x="250" y="226" fill="#555" font-size="11">под поверхностью?</text>
  <text x="250" y="255" fill="#3DCBC0" font-size="11" font-weight="600">→ 4 уровня</text>
  <text x="250" y="271" fill="#3DCBC0" font-size="11" font-weight="600">глубины</text>

  <!-- Arrow 2→3 -->
  <line x1="370" y1="210" x2="390" y2="210" stroke="#99ADCF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: CLD -->
  <rect x="400" y="130" width="140" height="160" fill="#fff" rx="10" stroke="#99ADCF" stroke-width="2"/>
  <rect x="400" y="130" width="140" height="35" fill="#99ADCF" rx="10"/>
  <rect x="400" y="155" width="140" height="10" fill="#99ADCF"/>
  <text x="470" y="153" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">CLD</text>
  <text x="420" y="188" fill="#0C2340" font-size="12" font-weight="600">Занятие 3</text>
  <text x="420" y="210" fill="#555" font-size="11">Как элементы</text>
  <text x="420" y="226" fill="#555" font-size="11">влияют друг</text>
  <text x="420" y="242" fill="#555" font-size="11">на друга?</text>
  <text x="420" y="271" fill="#3DCBC0" font-size="11" font-weight="600">→ R/B/delays</text>

  <!-- Arrow 3→4 -->
  <line x1="540" y1="210" x2="560" y2="210" stroke="#99ADCF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Archetypes -->
  <rect x="570" y="130" width="140" height="160" fill="#fff" rx="10" stroke="#0C2340" stroke-width="2"/>
  <rect x="570" y="130" width="140" height="35" fill="#0C2340" rx="10"/>
  <rect x="570" y="155" width="140" height="10" fill="#0C2340"/>
  <text x="640" y="153" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">АРХЕТИПЫ</text>
  <text x="590" y="188" fill="#0C2340" font-size="12" font-weight="600">Занятие 4</text>
  <text x="590" y="210" fill="#555" font-size="11">Какой типовой</text>
  <text x="590" y="226" fill="#555" font-size="11">паттерн?</text>
  <text x="590" y="255" fill="#3DCBC0" font-size="11" font-weight="600">→ Диагноз +</text>
  <text x="590" y="271" fill="#3DCBC0" font-size="11" font-weight="600">типичный рычаг</text>

  <!-- Big transition arrow 4→5 -->
  <rect x="718" y="185" width="50" height="50" fill="#3DCBC0" rx="25"/>
  <text x="743" y="216" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">→</text>

  <!-- Step 5: Leverage Points -->
  <rect x="780" y="130" width="140" height="160" fill="#fff" rx="10" stroke="#3DCBC0" stroke-width="2.5"/>
  <rect x="780" y="130" width="140" height="35" fill="#3DCBC0" rx="10"/>
  <rect x="780" y="155" width="140" height="10" fill="#3DCBC0"/>
  <text x="850" y="153" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">LEVERAGE PTS</text>
  <text x="800" y="188" fill="#0C2340" font-size="12" font-weight="600">Занятие 5</text>
  <text x="800" y="210" fill="#555" font-size="11">Где действовать?</text>
  <text x="800" y="226" fill="#555" font-size="11">5 уровней</text>
  <text x="800" y="255" fill="#3DCBC0" font-size="11" font-weight="600">→ Глубина</text>
  <text x="800" y="271" fill="#3DCBC0" font-size="11" font-weight="600">вмешательства</text>

  <!-- Arrow 5→6 -->
  <line x1="920" y1="210" x2="940" y2="210" stroke="#3DCBC0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Effort/Impact + Stakeholders -->
  <rect x="950" y="130" width="200" height="160" fill="#fff" rx="10" stroke="#3DCBC0" stroke-width="2.5"/>
  <rect x="950" y="130" width="200" height="35" fill="#3DCBC0" rx="10"/>
  <rect x="950" y="155" width="200" height="10" fill="#3DCBC0"/>
  <text x="1050" y="153" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">E/I + СТЕЙКХОЛДЕРЫ</text>
  <text x="970" y="188" fill="#0C2340" font-size="12" font-weight="600">Занятие 5</text>
  <text x="970" y="210" fill="#555" font-size="11">Что приоритизировать?</text>
  <text x="970" y="226" fill="#555" font-size="11">Кто влияет?</text>
  <text x="970" y="255" fill="#3DCBC0" font-size="11" font-weight="600">→ Портфель</text>
  <text x="970" y="271" fill="#3DCBC0" font-size="11" font-weight="600">гипотез решения</text>

  <!-- Bottom section: Iceberg × Leverage Points connection -->
  <rect x="60" y="340" width="1090" height="200" fill="#fff" rx="10" stroke="#0C2340" stroke-width="1.5"/>

  <text x="600" y="370" text-anchor="middle" fill="#0C2340" font-size="16" font-weight="700">СВЯЗЬ: ICEBERG × LEVERAGE POINTS</text>
  <text x="600" y="390" text-anchor="middle" fill="#666" font-size="12">Чем глубже в Iceberg — тем сильнее рычаг</text>

  <!-- Iceberg levels to Leverage levels mapping -->
  <!-- Level 1: Events → Parameters -->
  <rect x="100" y="410" width="180" height="35" fill="#D4D8DD" rx="6" opacity="0.3"/>
  <text x="190" y="432" text-anchor="middle" fill="#666" font-size="13" font-weight="600">События</text>
  <line x1="280" y1="427" x2="370" y2="427" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="325" y="422" fill="#999" font-size="10">→</text>
  <rect x="370" y="410" width="180" height="35" fill="#D4D8DD" rx="6" opacity="0.3"/>
  <text x="460" y="432" text-anchor="middle" fill="#666" font-size="13">Параметры (ур. 1)</text>
  <text x="580" y="432" fill="#999" font-size="12">⚪</text>

  <!-- Level 2: Patterns → Buffers/Structure -->
  <rect x="100" y="452" width="180" height="35" fill="#99ADCF" rx="6" opacity="0.2"/>
  <text x="190" y="474" text-anchor="middle" fill="#0C2340" font-size="13" font-weight="600">Паттерны</text>
  <line x1="280" y1="469" x2="370" y2="469" stroke="#99ADCF" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="325" y="464" fill="#99ADCF" font-size="10">→</text>
  <rect x="370" y="452" width="220" height="35" fill="#99ADCF" rx="6" opacity="0.2"/>
  <text x="480" y="474" text-anchor="middle" fill="#0C2340" font-size="13">Буферы / Структура (ур. 2-3)</text>
  <text x="620" y="474" fill="#99ADCF" font-size="12">⚪🔵</text>

  <!-- Level 3: Structures → Rules/Self-org -->
  <rect x="100" y="494" width="180" height="35" fill="#0C2340" rx="6" opacity="0.1"/>
  <text x="190" y="516" text-anchor="middle" fill="#0C2340" font-size="13" font-weight="600">Структуры</text>
  <line x1="280" y1="511" x2="370" y2="511" stroke="#0C2340" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="325" y="506" fill="#0C2340" font-size="10">→</text>
  <rect x="370" y="494" width="260" height="35" fill="#0C2340" rx="6" opacity="0.08"/>
  <text x="500" y="516" text-anchor="middle" fill="#0C2340" font-size="13">Правила / Самоорганизация (ур. 3)</text>
  <text x="660" y="516" fill="#0C2340" font-size="12">🔵🟠</text>

  <!-- Level 4: Mental Models → Goals/Paradigms -->
  <rect x="100" y="488" width="0" height="0"/>
  <rect x="100" y="536" width="180" height="35" fill="#e94560" rx="6" opacity="0.1"/>
  <text x="190" y="558" text-anchor="middle" fill="#e94560" font-size="13" font-weight="700">Ментальные модели</text>
  <line x1="280" y1="553" x2="370" y2="553" stroke="#e94560" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="325" y="548" fill="#e94560" font-size="10">→</text>
  <rect x="370" y="536" width="260" height="35" fill="#e94560" rx="6" opacity="0.08"/>
  <text x="500" y="558" text-anchor="middle" fill="#e94560" font-size="13" font-weight="600">Цели / Парадигмы (ур. 4-5)</text>
  <text x="660" y="558" fill="#e94560" font-size="12">🟠🔴</text>

  <!-- Depth arrow -->
  <text x="80" y="425" fill="#666" font-size="10" font-weight="600">Поверхность</text>
  <line x1="90" y1="435" x2="90" y2="555" stroke="#0C2340" stroke-width="2"/>
  <polygon points="90,555 85,545 95,545" fill="#0C2340"/>
  <text x="80" y="570" fill="#e94560" font-size="10" font-weight="600">Глубина</text>

  <!-- Right side: What's next -->
  <rect x="690" y="410" width="440" height="120" fill="#F7AF22" rx="10" opacity="0.08"/>
  <text x="910" y="440" text-anchor="middle" fill="#0C2340" font-size="15" font-weight="700">ЧТО ДАЛЬШЕ?</text>
  <text x="910" y="468" text-anchor="middle" fill="#555" font-size="13">Занятие 6: Валидация — как проверить гипотезу</text>
  <text x="910" y="490" text-anchor="middle" fill="#555" font-size="13">Занятие 7: Showcase 1 — презентация анализа</text>
  <text x="910" y="515" text-anchor="middle" fill="#0C2340" font-size="13" font-weight="600">Проблема → Анализ → Рычаг → Решение → Проверка</text>

  <!-- Footer section -->
  <rect x="60" y="570" width="1090" height="100" fill="#0C2340" rx="10" opacity="0.04"/>
  <text x="600" y="600" text-anchor="middle" fill="#0C2340" font-size="15" font-weight="700">ПОЛНЫЙ АНАЛИТИЧЕСКИЙ ЦИКЛ ЗА 5 ЗАНЯТИЙ</text>

  <!-- Mini timeline -->
  <circle cx="200" cy="635" r="18" fill="#99ADCF" opacity="0.3"/>
  <text x="200" y="640" text-anchor="middle" fill="#0C2340" font-size="12" font-weight="700">З2</text>
  <text x="200" y="660" text-anchor="middle" fill="#666" font-size="9">5 Why</text>
  <line x1="218" y1="635" x2="332" y2="635" stroke="#99ADCF" stroke-width="1.5"/>

  <circle cx="350" cy="635" r="18" fill="#99ADCF" opacity="0.3"/>
  <text x="350" y="640" text-anchor="middle" fill="#0C2340" font-size="12" font-weight="700">З3</text>
  <text x="350" y="660" text-anchor="middle" fill="#666" font-size="9">Iceberg+CLD</text>
  <line x1="368" y1="635" x2="482" y2="635" stroke="#99ADCF" stroke-width="1.5"/>

  <circle cx="500" cy="635" r="18" fill="#99ADCF" opacity="0.3"/>
  <text x="500" y="640" text-anchor="middle" fill="#0C2340" font-size="12" font-weight="700">З4</text>
  <text x="500" y="660" text-anchor="middle" fill="#666" font-size="9">Архетипы</text>
  <line x1="518" y1="635" x2="632" y2="635" stroke="#3DCBC0" stroke-width="2"/>

  <circle cx="650" cy="635" r="20" fill="#3DCBC0" opacity="0.3"/>
  <circle cx="650" cy="635" r="20" fill="none" stroke="#3DCBC0" stroke-width="2"/>
  <text x="650" y="640" text-anchor="middle" fill="#0C2340" font-size="12" font-weight="700">З5</text>
  <text x="650" y="660" text-anchor="middle" fill="#0C2340" font-size="9" font-weight="600">Рычаги</text>
  <line x1="670" y1="635" x2="782" y2="635" stroke="#99ADCF" stroke-width="1.5" stroke-dasharray="5,3"/>

  <circle cx="800" cy="635" r="18" fill="#F7AF22" opacity="0.15"/>
  <text x="800" y="640" text-anchor="middle" fill="#666" font-size="12" font-weight="700">З6</text>
  <text x="800" y="660" text-anchor="middle" fill="#666" font-size="9">Валидация</text>
  <line x1="818" y1="635" x2="932" y2="635" stroke="#99ADCF" stroke-width="1.5" stroke-dasharray="5,3"/>

  <circle cx="950" cy="635" r="18" fill="#F7AF22" opacity="0.15"/>
  <text x="950" y="640" text-anchor="middle" fill="#666" font-size="12" font-weight="700">З7</text>
  <text x="950" y="660" text-anchor="middle" fill="#666" font-size="9">Showcase</text>

  <!-- Footer -->
  <text x="600" y="695" text-anchor="middle" fill="#99ADCF" font-size="10">514-CM-MIPT | Системное и стратегическое мышление | Связь инструментов курса</text>
</svg>
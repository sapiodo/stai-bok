<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Inter, 'SF Pro Display', -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1200" height="750" fill="#F8FFF2" rx="12"/>

  <!-- Header -->
  <rect width="1200" height="70" fill="#0C2340" rx="12"/>
  <rect y="60" width="1200" height="12" fill="#0C2340"/>
  <text x="600" y="35" text-anchor="middle" fill="#F8FFF2" font-size="24" font-weight="700">ДЕРЕВО РЕШЕНИЙ: КАКОЙ АРХЕТИП?</text>
  <text x="600" y="55" text-anchor="middle" fill="#99ADCF" font-size="13">Алгоритм диагностики системного архетипа</text>

  <!-- Node styles: question = rounded rect blue, answer = rounded rect colored -->

  <!-- Root Question -->
  <rect x="400" y="90" width="400" height="50" fill="#0C2340" rx="25"/>
  <text x="600" y="120" text-anchor="middle" fill="#F8FFF2" font-size="14" font-weight="600">Проблема связана с ростом?</text>

  <!-- Left branch: YES -->
  <line x1="500" y1="140" x2="300" y2="190" stroke="#3DCBC0" stroke-width="2"/>
  <text x="380" y="168" fill="#3DCBC0" font-size="13" font-weight="700">Да</text>

  <!-- Right branch: NO -->
  <line x1="700" y1="140" x2="900" y2="190" stroke="#F7AF22" stroke-width="2"/>
  <text x="810" y="168" fill="#F7AF22" font-size="13" font-weight="700">Нет</text>

  <!-- Left: Growth sub-question -->
  <rect x="150" y="190" width="300" height="45" fill="#16213e" rx="22"/>
  <text x="300" y="218" text-anchor="middle" fill="#F8FFF2" font-size="13" font-weight="600">Рост замедлился?</text>

  <!-- Left-Left: YES = Limits to Growth -->
  <line x1="230" y1="235" x2="140" y2="290" stroke="#3DCBC0" stroke-width="2"/>
  <text x="170" y="265" fill="#3DCBC0" font-size="12" font-weight="700">Да</text>

  <rect x="40" y="290" width="200" height="55" fill="#3DCBC0" rx="10" opacity="0.2"/>
  <rect x="40" y="290" width="200" height="55" fill="none" stroke="#3DCBC0" stroke-width="2" rx="10"/>
  <text x="140" y="313" text-anchor="middle" fill="#0C2340" font-size="15" font-weight="700">Limits to Growth</text>
  <text x="140" y="333" text-anchor="middle" fill="#0C2340" font-size="11">«Раньше это работало»</text>

  <!-- Left-Right: NO = more questions -->
  <line x1="370" y1="235" x2="400" y2="290" stroke="#F7AF22" stroke-width="2"/>
  <text x="400" y="265" fill="#F7AF22" font-size="12" font-weight="700">Нет</text>

  <rect x="310" y="290" width="250" height="45" fill="#16213e" rx="22"/>
  <text x="435" y="318" text-anchor="middle" fill="#F8FFF2" font-size="13" font-weight="600">Конкуренция за ресурсы?</text>

  <!-- Left-Right-Left: YES = Success to Successful -->
  <line x1="380" y1="335" x2="320" y2="390" stroke="#3DCBC0" stroke-width="2"/>
  <text x="335" y="365" fill="#3DCBC0" font-size="12" font-weight="700">Да</text>

  <rect x="190" y="390" width="260" height="55" fill="#99ADCF" rx="10" opacity="0.2"/>
  <rect x="190" y="390" width="260" height="55" fill="none" stroke="#99ADCF" stroke-width="2" rx="10"/>
  <text x="320" y="413" text-anchor="middle" fill="#0C2340" font-size="15" font-weight="700">Success to the Successful</text>
  <text x="320" y="433" text-anchor="middle" fill="#0C2340" font-size="11">«Одно направление всегда выигрывает»</text>

  <!-- Right: No growth -->
  <rect x="750" y="190" width="300" height="45" fill="#16213e" rx="22"/>
  <text x="900" y="218" text-anchor="middle" fill="#F8FFF2" font-size="13" font-weight="600">Проблема повторяется?</text>

  <!-- Right-Left: YES -->
  <line x1="830" y1="235" x2="750" y2="290" stroke="#3DCBC0" stroke-width="2"/>
  <text x="775" y="265" fill="#3DCBC0" font-size="12" font-weight="700">Да</text>

  <!-- Right-Right: NO -->
  <line x1="970" y1="235" x2="1050" y2="290" stroke="#F7AF22" stroke-width="2"/>
  <text x="1025" y="265" fill="#F7AF22" font-size="12" font-weight="700">Нет</text>

  <!-- Right-Left: Repeats -->
  <rect x="600" y="290" width="300" height="45" fill="#16213e" rx="22"/>
  <text x="750" y="312" text-anchor="middle" fill="#F8FFF2" font-size="12" font-weight="600">Зависим от одного решения?</text>
  <text x="750" y="328" text-anchor="middle" fill="#99ADCF" font-size="11">(применяем снова и снова)</text>

  <!-- Right-Left-Left: YES = Shifting the Burden -->
  <line x1="680" y1="335" x2="630" y2="395" stroke="#3DCBC0" stroke-width="2"/>
  <text x="640" y="368" fill="#3DCBC0" font-size="12" font-weight="700">Да</text>

  <rect x="500" y="395" width="260" height="55" fill="#0C2340" rx="10" opacity="0.1"/>
  <rect x="500" y="395" width="260" height="55" fill="none" stroke="#0C2340" stroke-width="2" rx="10"/>
  <text x="630" y="418" text-anchor="middle" fill="#0C2340" font-size="15" font-weight="700">Shifting the Burden</text>
  <text x="630" y="438" text-anchor="middle" fill="#0C2340" font-size="11">«Без этого мы не можем»</text>

  <!-- Right-Left-Right: NO = more questions -->
  <line x1="820" y1="335" x2="870" y2="395" stroke="#F7AF22" stroke-width="2"/>
  <text x="860" y="368" fill="#F7AF22" font-size="12" font-weight="700">Нет</text>

  <rect x="780" y="395" width="260" height="45" fill="#16213e" rx="22"/>
  <text x="910" y="414" text-anchor="middle" fill="#F8FFF2" font-size="12" font-weight="600">Вернулась через время,</text>
  <text x="910" y="432" text-anchor="middle" fill="#F8FFF2" font-size="12" font-weight="600">но хуже?</text>

  <!-- Yes = Fixes that Fail -->
  <line x1="860" y1="440" x2="820" y2="500" stroke="#3DCBC0" stroke-width="2"/>
  <text x="825" y="472" fill="#3DCBC0" font-size="12" font-weight="700">Да</text>

  <rect x="700" y="500" width="240" height="55" fill="#F7AF22" rx="10" opacity="0.15"/>
  <rect x="700" y="500" width="240" height="55" fill="none" stroke="#F7AF22" stroke-width="2" rx="10"/>
  <text x="820" y="523" text-anchor="middle" fill="#0C2340" font-size="15" font-weight="700">Fixes that Fail</text>
  <text x="820" y="543" text-anchor="middle" fill="#0C2340" font-size="11">«Проблема вернулась, но хуже»</text>

  <!-- Right-Right: No repeat = goals? -->
  <rect x="960" y="290" width="210" height="45" fill="#16213e" rx="22"/>
  <text x="1065" y="318" text-anchor="middle" fill="#F8FFF2" font-size="13" font-weight="600">Цели снизились?</text>

  <!-- Yes = Eroding Goals -->
  <line x1="1030" y1="335" x2="1020" y2="395" stroke="#3DCBC0" stroke-width="2"/>
  <text x="1010" y="368" fill="#3DCBC0" font-size="12" font-weight="700">Да</text>

  <rect x="920" y="395" width="210" height="55" fill="#e94560" rx="10" opacity="0.1"/>
  <rect x="920" y="395" width="210" height="55" fill="none" stroke="#e94560" stroke-width="2" rx="10"/>
  <text x="1025" y="418" text-anchor="middle" fill="#0C2340" font-size="15" font-weight="700">Eroding Goals</text>
  <text x="1025" y="438" text-anchor="middle" fill="#0C2340" font-size="11">«Раньше ставили выше цели»</text>

  <!-- Disclaimer box -->
  <rect x="80" y="590" width="1040" height="70" fill="#0C2340" rx="10" opacity="0.06"/>
  <text x="600" y="615" text-anchor="middle" fill="#0C2340" font-size="14" font-weight="600">⚠ Дерево — стартовая навигация, не приговор</text>
  <text x="600" y="638" text-anchor="middle" fill="#555" font-size="13">В реальных системах часто действуют несколько архетипов одновременно.</text>
  <text x="600" y="655" text-anchor="middle" fill="#555" font-size="13">Fixes that Fail может стать Shifting the Burden. Limits to Growth + Eroding Goals = деградация под давлением.</text>

  <!-- Symptom table header -->
  <rect x="80" y="680" width="1040" height="30" fill="#0C2340" rx="6" opacity="0.08"/>
  <text x="200" y="700" text-anchor="middle" fill="#0C2340" font-size="12" font-weight="700">ЕСЛИ СЛЫШИТЕ...</text>
  <text x="700" y="700" text-anchor="middle" fill="#0C2340" font-size="12" font-weight="700">ВЕРОЯТНЫЙ АРХЕТИП</text>

  <text x="100" y="728" fill="#333" font-size="12" font-style="italic">«Раньше это работало» → Limits to Growth</text>
  <text x="500" y="728" fill="#333" font-size="12" font-style="italic">«Без этого не можем» → Shifting the Burden</text>
  <text x="900" y="728" fill="#333" font-size="12" font-style="italic">«Цели снизились» → Eroding Goals</text>

  <!-- Footer -->
  <text x="600" y="748" text-anchor="middle" fill="#99ADCF" font-size="10">514-CM-MIPT | Занятие 4 | Диагностика архетипов</text>
</svg>
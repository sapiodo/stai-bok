<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="650" fill="#fafcfe" rx="12"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="50" fill="#1a5276" rx="12"/>
  <rect x="0" y="25" width="900" height="25" fill="#1a5276"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Нотация Causal Loop Diagram (CLD)</text>

  <!-- Section 1: Variables -->
  <rect x="20" y="70" width="420" height="120" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="230" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5276">ПЕРЕМЕННЫЕ</text>
  <text x="230" y="115" text-anchor="middle" font-size="11" fill="#5d6d7e">Элементы, которые могут расти или уменьшаться</text>

  <rect x="45" y="130" width="110" height="35" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="100" y="152" text-anchor="middle" font-size="11" fill="#2c3e50">Время в YouTube</text>

  <rect x="175" y="130" width="90" height="35" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="220" y="152" text-anchor="middle" font-size="11" fill="#2c3e50">Усталость</text>

  <rect x="285" y="130" width="90" height="35" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="330" y="152" text-anchor="middle" font-size="11" fill="#2c3e50">Мотивация</text>

  <!-- Section 2: Arrows and Signs -->
  <rect x="460" y="70" width="420" height="120" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="670" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5276">СТРЕЛКИ И ЗНАКИ</text>

  <!-- Plus sign example -->
  <rect x="480" y="115" width="60" height="25" rx="4" fill="#fff" stroke="#2c3e50" stroke-width="1"/>
  <text x="510" y="132" text-anchor="middle" font-size="10" fill="#2c3e50">A</text>
  <line x1="540" y1="127" x2="600" y2="127" stroke="#27ae60" stroke-width="2.5"/>
  <polygon points="600,127 590,122 590,132" fill="#27ae60"/>
  <rect x="605" y="115" width="60" height="25" rx="4" fill="#fff" stroke="#2c3e50" stroke-width="1"/>
  <text x="635" y="132" text-anchor="middle" font-size="10" fill="#2c3e50">B</text>
  <circle cx="570" cy="118" r="10" fill="#27ae60"/>
  <text x="570" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">+</text>
  <text x="710" y="132" font-size="10" fill="#2c3e50">A↑ → B↑ (same)</text>

  <!-- Minus sign example -->
  <rect x="480" y="150" width="60" height="25" rx="4" fill="#fff" stroke="#2c3e50" stroke-width="1"/>
  <text x="510" y="167" text-anchor="middle" font-size="10" fill="#2c3e50">A</text>
  <line x1="540" y1="162" x2="600" y2="162" stroke="#e74c3c" stroke-width="2.5"/>
  <polygon points="600,162 590,157 590,167" fill="#e74c3c"/>
  <rect x="605" y="150" width="60" height="25" rx="4" fill="#fff" stroke="#2c3e50" stroke-width="1"/>
  <text x="635" y="167" text-anchor="middle" font-size="10" fill="#2c3e50">B</text>
  <circle cx="570" cy="153" r="10" fill="#e74c3c"/>
  <text x="570" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">−</text>
  <text x="710" y="167" font-size="10" fill="#2c3e50">A↑ → B↓ (opposite)</text>

  <!-- Section 3: Loop Types -->
  <rect x="20" y="210" width="860" height="200" rx="8" fill="#f0f7ed" stroke="#27ae60" stroke-width="1.5"/>
  <text x="450" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5276">ТИПЫ ПЕТЕЛЬ — определение по правилу чётности минусов</text>

  <!-- R-loop -->
  <rect x="40" y="260" width="400" height="130" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <circle cx="70" cy="325" r="22" fill="#27ae60"/>
  <text x="70" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">R</text>
  <text x="100" y="290" font-size="13" font-weight="bold" fill="#27ae60">Reinforcing — усиливающая</text>
  <text x="100" y="312" font-size="12" fill="#2c3e50">Чётное число минусов (0, 2, 4...)</text>
  <text x="100" y="332" font-size="11" fill="#5d6d7e">Рост → ещё больше роста</text>
  <text x="100" y="352" font-size="11" fill="#5d6d7e">Падение → ещё большее падение</text>
  <text x="100" y="375" font-size="11" font-style="italic" fill="#7f8c8d">Пример: A→(+)→B→(+)→A = 0 минусов → R</text>

  <!-- B-loop -->
  <rect x="460" y="260" width="400" height="130" rx="8" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
  <circle cx="490" cy="325" r="22" fill="#e67e22"/>
  <text x="490" y="332" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">B</text>
  <text x="520" y="290" font-size="13" font-weight="bold" fill="#e67e22">Balancing — балансирующая</text>
  <text x="520" y="312" font-size="12" fill="#2c3e50">Нечётное число минусов (1, 3, 5...)</text>
  <text x="520" y="332" font-size="11" fill="#5d6d7e">Система стремится к равновесию</text>
  <text x="520" y="352" font-size="11" fill="#5d6d7e">Действует как тормоз / регулятор</text>
  <text x="520" y="375" font-size="11" font-style="italic" fill="#7f8c8d">Пример: A→(+)→B→(−)→A = 1 минус → B</text>

  <!-- Section 4: Delays -->
  <rect x="20" y="430" width="860" height="100" rx="8" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5"/>
  <text x="450" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5276">ЗАПАЗДЫВАНИЕ (Delay)</text>

  <!-- Delay arrow example -->
  <rect x="120" y="475" width="80" height="30" rx="4" fill="#fff" stroke="#2c3e50" stroke-width="1"/>
  <text x="160" y="495" text-anchor="middle" font-size="11" fill="#2c3e50">Привычка</text>
  <line x1="200" y1="490" x2="350" y2="490" stroke="#e67e22" stroke-width="2.5"/>
  <polygon points="350,490 340,485 340,495" fill="#e67e22"/>
  <!-- Delay marks -->
  <line x1="260" y1="480" x2="260" y2="500" stroke="#e67e22" stroke-width="2.5"/>
  <line x1="270" y1="480" x2="270" y2="500" stroke="#e67e22" stroke-width="2.5"/>
  <rect x="355" y="475" width="80" height="30" rx="4" fill="#fff" stroke="#2c3e50" stroke-width="1"/>
  <text x="395" y="495" text-anchor="middle" font-size="11" fill="#2c3e50">GPA</text>

  <text x="530" y="485" font-size="12" fill="#2c3e50">Обозначение: ‖ на стрелке</text>
  <text x="530" y="505" font-size="11" fill="#5d6d7e">Эффект наступает не сразу (дни, недели, месяцы)</text>
  <text x="530" y="520" font-size="11" fill="#7f8c8d" font-style="italic">Закон Сенге #7: «Причина и следствие не близки во времени»</text>

  <!-- Key Rule Box -->
  <rect x="20" y="550" width="860" height="75" rx="8" fill="#1a5276" stroke="#0e3654" stroke-width="2"/>
  <text x="450" y="578" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">КЛЮЧЕВОЕ ПРАВИЛО</text>
  <text x="450" y="602" text-anchor="middle" font-size="14" fill="#d5e8f0">Подсчитай минусы в петле: чётное число → R (усиливающая), нечётное → B (балансирующая)</text>

  <!-- Footer -->
  <text x="450" y="645" text-anchor="middle" font-size="10" fill="#bdc3c7">514-CM-MIPT | Занятие 3 | Нотация CLD</text>
</svg>
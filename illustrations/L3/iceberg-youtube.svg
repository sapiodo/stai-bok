<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="water2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dce9f4"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="60" fill="#c0392b" rx="0"/>
  <text x="450" y="22" text-anchor="middle" font-size="11" fill="#ffffff">▶ YouTube</text>
  <text x="450" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Iceberg Model — прокрастинация через алгоритмическую ленту</text>

  <!-- Sky -->
  <rect x="0" y="60" width="900" height="200" fill="#fef9e7"/>

  <!-- Water -->
  <rect x="0" y="260" width="900" height="750" fill="url(#water2)"/>

  <!-- Waterline -->
  <line x1="0" y1="260" x2="900" y2="260" stroke="#5dade2" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- Iceberg shape -->
  <polygon points="350,90 550,90 590,260 630,400 660,560 640,740 580,880 320,880 260,740 240,560 270,400 310,260"
           fill="#d6eaf8" stroke="#85c1e9" stroke-width="2" fill-opacity="0.6"/>

  <!-- LEVEL 1: Events -->
  <rect x="50" y="80" width="280" height="150" rx="10" fill="#ffffff" stroke="#e74c3c" stroke-width="2.5"/>
  <rect x="50" y="80" width="280" height="30" rx="10" fill="#e74c3c"/>
  <text x="190" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">👁 СОБЫТИЯ</text>
  <text x="65" y="130" font-size="12" fill="#2c3e50">• Студент «залип» на YouTube</text>
  <text x="75" y="148" font-size="12" fill="#2c3e50">на 3 часа вместо учёбы</text>
  <text x="65" y="170" font-size="12" fill="#2c3e50">• Домашка не сделана</text>
  <text x="65" y="190" font-size="12" fill="#2c3e50">• Пришёл на пару невыспавшимся</text>

  <!-- LEVEL 2: Patterns -->
  <rect x="560" y="280" width="310" height="140" rx="10" fill="#eaf2f8" stroke="#2980b9" stroke-width="2.5"/>
  <rect x="560" y="280" width="310" height="30" rx="10" fill="#2980b9"/>
  <text x="715" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">🔄 ПАТТЕРНЫ</text>
  <text x="575" y="328" font-size="12" fill="#1a5276">• «Ещё одно видео» каждый вечер</text>
  <text x="575" y="348" font-size="12" fill="#1a5276">• Пик YouTube перед сессией</text>
  <text x="575" y="368" font-size="12" fill="#1a5276">• Откладывание дел до ночи</text>
  <text x="585" y="388" font-size="12" fill="#1a5276">перед дедлайном</text>

  <!-- LEVEL 3: Structures -->
  <rect x="50" y="460" width="310" height="170" rx="10" fill="#d4e6f1" stroke="#1f618d" stroke-width="2.5"/>
  <rect x="50" y="460" width="310" height="30" rx="10" fill="#1f618d"/>
  <text x="205" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">⚙️ СТРУКТУРЫ</text>
  <text x="65" y="510" font-size="12" fill="#0e3654">• Алгоритм рекомендаций</text>
  <text x="65" y="530" font-size="12" fill="#0e3654">• Autoplay (автовоспроизведение)</text>
  <text x="65" y="550" font-size="12" fill="#0e3654">• Бесконечная лента</text>
  <text x="65" y="570" font-size="12" fill="#0e3654">• Personalized thumbnails</text>
  <text x="65" y="590" font-size="12" fill="#0e3654">• Нет «стоп-сигнала» в UI</text>
  <text x="65" y="610" font-size="12" fill="#0e3654">• Бесплатный доступ 24/7</text>

  <!-- LEVEL 4: Mental Models -->
  <rect x="540" y="680" width="330" height="180" rx="10" fill="#a9cce3" stroke="#0b3d59" stroke-width="2.5"/>
  <rect x="540" y="680" width="330" height="30" rx="10" fill="#0b3d59"/>
  <text x="705" y="700" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">🧠 МЕНТАЛЬНЫЕ МОДЕЛИ</text>
  <text x="555" y="728" font-size="11" font-weight="bold" fill="#0b3d59">Пользователь:</text>
  <text x="555" y="746" font-size="12" fill="#1a3c5e">• «Ещё 10 минут — и пойду делать»</text>
  <text x="555" y="764" font-size="12" fill="#1a3c5e">• «Я контролирую своё время»</text>
  <text x="555" y="788" font-size="11" font-weight="bold" fill="#0b3d59">Команда YouTube:</text>
  <text x="555" y="806" font-size="12" fill="#1a3c5e">• «Вовлечённость = ценность»</text>
  <text x="555" y="824" font-size="12" fill="#1a3c5e">• «Больше времени = успех»</text>

  <!-- Feedback arrow -->
  <path d="M 840,870 Q 880,500 840,130 L 830,140 M 840,130 L 850,140"
        fill="none" stroke="#e67e22" stroke-width="2.5" marker-end="none"/>
  <polygon points="840,130 830,150 850,150" fill="#e67e22"/>
  <text x="875" y="500" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold"
        transform="rotate(90,875,500)">Обратная связь: цикл замкнулся</text>

  <!-- Connector lines -->
  <line x1="330" y1="155" x2="350" y2="155" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="560" y1="350" x2="540" y2="350" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="360" y1="545" x2="400" y2="545" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="540" y1="770" x2="520" y2="770" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Footer -->
  <text x="450" y="960" text-anchor="middle" font-size="11" fill="#7f8c8d">514-CM-MIPT | Занятие 3 | Iceberg Model</text>
</svg>
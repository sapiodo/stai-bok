<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="1000" height="600" fill="#fafcfe" rx="12"/>

  <!-- Title -->
  <rect x="0" y="0" width="1000" height="50" fill="#c0392b" rx="12"/>
  <rect x="0" y="25" width="1000" height="25" fill="#c0392b"/>
  <text x="500" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">YouTube: R-петля вовлечённости vs B-петля усталости</text>

  <!-- ==================== R-LOOP (left side) ==================== -->

  <!-- R-loop background -->
  <rect x="20" y="70" width="500" height="420" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2" stroke-dasharray="8,4"/>
  <circle cx="55" cy="100" r="18" fill="#27ae60"/>
  <text x="55" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">R1</text>
  <text x="80" y="100" font-size="14" font-weight="bold" fill="#27ae60">Петля вовлечённости</text>
  <text x="80" y="118" font-size="11" fill="#7f8c8d">0 минусов (чётное) → Reinforcing</text>

  <!-- R-loop variables -->
  <!-- Время просмотра -->
  <rect x="60" y="180" width="150" height="40" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="135" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Время просмотра</text>

  <!-- Данные для алгоритма -->
  <rect x="310" y="140" width="170" height="40" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="395" y="165" text-anchor="middle" font-size="11" fill="#2c3e50">Данные для алгоритма</text>

  <!-- Точность рекомендаций -->
  <rect x="320" y="280" width="170" height="40" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="405" y="305" text-anchor="middle" font-size="11" fill="#2c3e50">Точность рекомендаций</text>

  <!-- Интересность контента -->
  <rect x="60" y="340" width="170" height="40" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="145" y="365" text-anchor="middle" font-size="11" fill="#2c3e50">Интересность контента</text>

  <!-- R-loop arrows -->
  <!-- Время → Данные (+) -->
  <line x1="210" y1="190" x2="308" y2="162" stroke="#27ae60" stroke-width="2"/>
  <polygon points="308,162 298,155 296,166" fill="#27ae60"/>
  <circle cx="255" cy="172" r="10" fill="#27ae60"/>
  <text x="255" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">+</text>

  <!-- Данные → Точность (+) -->
  <line x1="420" y1="180" x2="425" y2="278" stroke="#27ae60" stroke-width="2"/>
  <polygon points="425,278 419,268 431,268" fill="#27ae60"/>
  <circle cx="426" cy="230" r="10" fill="#27ae60"/>
  <text x="426" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">+</text>

  <!-- Точность → Интересность (+) -->
  <line x1="320" y1="310" x2="232" y2="345" stroke="#27ae60" stroke-width="2"/>
  <polygon points="232,345 240,336 244,347" fill="#27ae60"/>
  <circle cx="275" cy="330" r="10" fill="#27ae60"/>
  <text x="275" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">+</text>

  <!-- Интересность → Время (+) -->
  <line x1="105" y1="340" x2="115" y2="222" stroke="#27ae60" stroke-width="2"/>
  <polygon points="115,222 109,232 121,232" fill="#27ae60"/>
  <circle cx="108" cy="280" r="10" fill="#27ae60"/>
  <text x="108" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">+</text>

  <!-- R-loop description -->
  <text x="270" y="430" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="bold">Больше смотришь → точнее алгоритм →</text>
  <text x="270" y="448" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="bold">интереснее контент → ещё больше смотришь</text>
  <text x="270" y="470" text-anchor="middle" font-size="11" fill="#7f8c8d" font-style="italic">Работает мгновенно ⚡</text>

  <!-- ==================== B-LOOP (right side) ==================== -->

  <!-- B-loop background -->
  <rect x="540" y="70" width="440" height="420" rx="10" fill="#fef5e7" stroke="#e67e22" stroke-width="2" stroke-dasharray="8,4"/>
  <circle cx="575" cy="100" r="18" fill="#e67e22"/>
  <text x="575" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">B1</text>
  <text x="600" y="100" font-size="14" font-weight="bold" fill="#e67e22">Петля усталости</text>
  <text x="600" y="118" font-size="11" fill="#7f8c8d">1 минус (нечётное) → Balancing</text>

  <!-- B-loop variables -->
  <!-- Время просмотра (shared — reference) -->
  <rect x="590" y="180" width="150" height="40" rx="8" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
  <text x="665" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Время просмотра</text>

  <!-- Усталость -->
  <rect x="800" y="260" width="140" height="40" rx="8" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
  <text x="870" y="285" text-anchor="middle" font-size="12" fill="#2c3e50">Усталость</text>

  <!-- Желание закрыть -->
  <rect x="610" y="350" width="160" height="40" rx="8" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
  <text x="690" y="375" text-anchor="middle" font-size="12" fill="#2c3e50">Желание закрыть</text>

  <!-- B-loop arrows -->
  <!-- Время → Усталость (+) -->
  <line x1="740" y1="200" x2="800" y2="260" stroke="#e67e22" stroke-width="2"/>
  <polygon points="800,260 792,252 802,249" fill="#e67e22"/>
  <circle cx="772" cy="225" r="10" fill="#e67e22"/>
  <text x="772" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">+</text>

  <!-- Delay marks on Усталость arrow -->
  <line x1="758" y1="218" x2="764" y2="225" stroke="#e67e22" stroke-width="2.5"/>
  <line x1="762" y1="215" x2="768" y2="222" stroke="#e67e22" stroke-width="2.5"/>

  <!-- Усталость → Желание (+) -->
  <line x1="830" y1="300" x2="770" y2="350" stroke="#e67e22" stroke-width="2"/>
  <polygon points="770,350 780,343 778,354" fill="#e67e22"/>
  <circle cx="800" cy="328" r="10" fill="#e67e22"/>
  <text x="800" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">+</text>

  <!-- Желание → Время (−) -->
  <line x1="660" y1="350" x2="660" y2="222" stroke="#e74c3c" stroke-width="2"/>
  <polygon points="660,222 654,232 666,232" fill="#e74c3c"/>
  <circle cx="660" cy="285" r="10" fill="#e74c3c"/>
  <text x="660" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">−</text>

  <!-- B-loop description -->
  <text x="760" y="430" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold">Больше смотришь → устаёшь →</text>
  <text x="760" y="448" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold">хочешь закрыть → время ↓</text>
  <text x="760" y="470" text-anchor="middle" font-size="11" fill="#7f8c8d" font-style="italic">Запаздывает ‖ (часы)</text>

  <!-- ==================== VS / Competition ==================== -->

  <!-- Central verdict -->
  <rect x="300" y="510" width="400" height="70" rx="10" fill="#1a5276"/>
  <text x="500" y="535" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">R побеждает B, потому что B запаздывает</text>
  <text x="500" y="558" text-anchor="middle" font-size="12" fill="#d5e8f0">Алгоритм подкидывает видео мгновенно ⚡ — усталость копится часами ‖</text>

  <!-- VS badge -->
  <circle cx="530" cy="265" r="22" fill="#2c3e50" stroke="#fff" stroke-width="3"/>
  <text x="530" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">VS</text>

  <!-- Footer -->
  <text x="500" y="598" text-anchor="middle" font-size="10" fill="#bdc3c7">514-CM-MIPT | Занятие 3 | CLD: конкуренция петель</text>
</svg>
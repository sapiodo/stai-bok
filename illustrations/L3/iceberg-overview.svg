<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f0ff"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d5e8f0"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a5276">Модель Iceberg — четыре уровня анализа</text>

  <!-- Sky -->
  <rect x="0" y="60" width="800" height="200" fill="#e8f4fd"/>

  <!-- Water -->
  <rect x="0" y="260" width="800" height="700" fill="url(#water)"/>

  <!-- Waterline -->
  <line x1="0" y1="260" x2="800" y2="260" stroke="#4a90d9" stroke-width="3" stroke-dasharray="12,6"/>
  <text x="780" y="255" text-anchor="end" font-size="13" fill="#4a90d9" font-style="italic">── линия воды ──</text>

  <!-- Iceberg shape -->
  <polygon points="300,100 500,100 540,260 580,400 600,550 560,720 500,850 300,850 240,720 200,550 220,400 260,260" fill="url(#ice)" stroke="#88b4d0" stroke-width="2"/>

  <!-- Level 1: Events (above water) -->
  <rect x="310" y="120" width="180" height="110" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">👁 СОБЫТИЯ</text>
  <text x="400" y="170" text-anchor="middle" font-size="13" fill="#5d6d7e">Events</text>
  <text x="400" y="195" text-anchor="middle" font-size="12" fill="#7f8c8d" font-style="italic">«Что произошло?»</text>
  <text x="400" y="215" text-anchor="middle" font-size="11" fill="#95a5a6">Видимые проявления</text>

  <!-- Level 2: Patterns -->
  <rect x="270" y="290" width="260" height="100" rx="8" fill="#d4e6f1" fill-opacity="0.9" stroke="#2980b9" stroke-width="2"/>
  <text x="400" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a5276">🔄 ПАТТЕРНЫ</text>
  <text x="400" y="340" text-anchor="middle" font-size="13" fill="#2c3e50">Patterns</text>
  <text x="400" y="365" text-anchor="middle" font-size="12" fill="#34495e" font-style="italic">«Что повторяется?»</text>
  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#5d6d7e">Тренды, привычки, закономерности</text>

  <!-- Level 3: Structures -->
  <rect x="250" y="440" width="300" height="100" rx="8" fill="#a9cce3" fill-opacity="0.9" stroke="#2471a3" stroke-width="2"/>
  <text x="400" y="468" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a5276">⚙️ СТРУКТУРЫ</text>
  <text x="400" y="490" text-anchor="middle" font-size="13" fill="#1a5276">Structures</text>
  <text x="400" y="515" text-anchor="middle" font-size="12" fill="#1a5276" font-style="italic">«Что порождает паттерны?»</text>
  <text x="400" y="530" text-anchor="middle" font-size="11" fill="#2c3e50">Процессы, правила, технологии</text>

  <!-- Level 4: Mental Models -->
  <rect x="270" y="600" width="260" height="110" rx="8" fill="#7fb3d8" fill-opacity="0.9" stroke="#1a5276" stroke-width="2"/>
  <text x="400" y="628" text-anchor="middle" font-size="16" font-weight="bold" fill="#0a3055">🧠 МЕНТАЛЬНЫЕ</text>
  <text x="400" y="648" text-anchor="middle" font-size="16" font-weight="bold" fill="#0a3055">МОДЕЛИ</text>
  <text x="400" y="668" text-anchor="middle" font-size="13" fill="#1a5276">Mental Models</text>
  <text x="400" y="693" text-anchor="middle" font-size="12" fill="#1a5276" font-style="italic">«Во что мы верим?»</text>

  <!-- Right side arrows -->
  <!-- Down arrow: Analysis -->
  <line x1="660" y1="150" x2="660" y2="680" stroke="#e74c3c" stroke-width="2.5"/>
  <polygon points="660,700 650,680 670,680" fill="#e74c3c"/>
  <text x="700" y="420" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold" transform="rotate(90,700,420)">Анализ ↓ (сверху вниз)</text>

  <!-- Up arrow: Synthesis -->
  <line x1="720" y1="700" x2="720" y2="170" stroke="#27ae60" stroke-width="2.5"/>
  <polygon points="720,150 710,170 730,170" fill="#27ae60"/>
  <text x="760" y="420" text-anchor="middle" font-size="14" fill="#27ae60" font-weight="bold" transform="rotate(90,760,420)">Синтез ↑ (снизу вверх)</text>

  <!-- Depth indicator -->
  <text x="160" y="180" text-anchor="middle" font-size="12" fill="#7f8c8d">10% видно</text>
  <text x="160" y="500" text-anchor="middle" font-size="12" fill="#d5e8f0">90% скрыто</text>

  <!-- Footer -->
  <text x="400" y="920" text-anchor="middle" font-size="12" fill="#95a5a6">Источник: Senge (1990), Kim (1994)</text>
  <text x="400" y="940" text-anchor="middle" font-size="11" fill="#bdc3c7">514-CM-MIPT | Занятие 3</text>
</svg>